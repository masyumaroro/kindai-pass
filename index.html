<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KINDAI PASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Layout: on a computer the app runs inside a phone mockup on the left and a prototype guide sits on the right; on a phone the app fills the screen and the guide moves into the 試作品 sheet. */
:root{
  /* the page around the phone follows the viewer's theme */
  --page:#E8ECF3; --panel:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D5DCE8;
  --accent:#1D4E9E; --accent-ink:#FFFFFF; --accent-soft:#E2E9F5; --bezel:#121A2B; --focus:#E0A100;
  /* the app keeps the product's own light look in both themes */
  --app-bg:#F4F6F9; --app-card:#FFFFFF; --app-ink:#14213D; --app-muted:#566176; --app-line:#DCE2EC;
  --app-accent:#1D4E9E; --app-accent-ink:#FFFFFF; --app-soft:#E9EEF7; --app-ok-bg:#E4F2E8; --app-ok:#1E6A3B;
  --app-warn-bg:#FCEFD6; --app-warn:#8A5300; --app-alert:#C23B2F; --app-scrim:rgba(20,33,61,.42);
  --app-map:#EDF1F7; --app-room:#FFFFFF; --app-bar:#0B0F17; --app-dark:#14213D; --app-focus:#B97F00;
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0D1421; --panel:#152035; --ink:#E7ECF5; --muted:#9BA8BF; --line:#2A3752;
    --accent:#8DAEEB; --accent-ink:#0D1421; --accent-soft:#1D2B47; --bezel:#03060C; --focus:#F2C14E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0D1421; --panel:#152035; --ink:#E7ECF5; --muted:#9BA8BF; --line:#2A3752;
  --accent:#8DAEEB; --accent-ink:#0D1421; --accent-soft:#1D2B47; --bezel:#03060C; --focus:#F2C14E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;font-feature-settings:"palt";-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}

/* ---------- page layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:auto minmax(0,1fr);gap:44px;align-items:start}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:28px}.stage{position:static;justify-self:center}}

/* ---------- phone frame ---------- */
.phone{height:min(790px,calc(100vh - 40px));min-height:640px;aspect-ratio:380/790;max-width:100%;background:var(--bezel);border-radius:54px;padding:12px;box-shadow:0 24px 60px rgba(13,20,33,.28)}
.screen{position:relative;height:100%;border-radius:43px;overflow:hidden;overflow:clip;background:var(--app-bg);color:var(--app-ink);display:flex;flex-direction:column;color-scheme:light;--s:1;--gut:22px}
.pbody>*,.vpad>*,.sbody>*,.ostep>*,.guide>*,.today>:not(.grow){flex-shrink:0}
.screen[data-size="large"]{--s:1.13}
.screen[data-size="xl"]{--s:1.26}
.screen :focus-visible{outline-color:var(--app-focus)}
.sbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 30px 2px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.sbar .notch{width:96px;height:26px;border-radius:14px;background:var(--bezel)}
.sbar .batt{font-size:12px;font-weight:500;color:var(--app-muted)}
.appbar{flex:none;display:flex;align-items:center;gap:4px;padding:4px 12px 2px var(--gut);min-height:50px}
.brand{margin-right:auto;font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--app-accent);white-space:nowrap}
.hbtn{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--app-ink);display:grid;place-items:center}
.hbtn:hover{background:var(--app-soft)}
.hbtn svg{width:23px;height:23px}
.hbtn .dot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--app-alert);border:2px solid var(--app-bg)}
.pill{display:none;align-items:center;gap:6px;border:1px solid var(--app-line);background:var(--app-card);color:var(--app-accent);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill .clk{color:var(--app-ink);font-variant-numeric:tabular-nums;font-weight:500}

/* ---------- views ---------- */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.today{min-height:100%;display:flex;flex-direction:column;padding:8px var(--gut) 18px}
.today.enter .anim{animation:enter .38s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dateline{font-size:calc(var(--s)*12.5px);color:var(--app-muted);margin-bottom:16px}
.statusline{display:flex;gap:8px;align-items:center;font-size:calc(var(--s)*14px);color:var(--app-muted);margin-bottom:10px}
.statusline svg{width:20px;height:20px;flex:none}
.statusline.ok svg{color:var(--app-accent)}
.statusline.warn{color:var(--app-warn);font-weight:700}
.statusline.warn svg{color:var(--app-warn)}
.kicker{font-size:calc(var(--s)*14px);color:var(--app-muted)}
.dest,.sub,.navtx b,.sp,.onb h2,.ph,.banner .b{word-break:auto-phrase}
.dest{font-size:calc(var(--s)*31px);font-weight:900;line-height:1.28;letter-spacing:.01em;text-wrap:balance;margin-top:2px}
.dest em{font-style:normal;color:var(--app-accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:calc(var(--s)*15px);color:var(--app-muted);margin-top:8px}
.sub em{font-style:normal;font-weight:700;color:var(--app-ink);font-variant-numeric:tabular-nums}
.grow{flex:1;min-height:18px}
.card{background:var(--app-soft);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:1px;margin-bottom:12px}
.card .l{font-size:calc(var(--s)*13px);color:var(--app-muted)}
.card .v{font-size:calc(var(--s)*16px);font-weight:700}
.card.ok{background:var(--app-ok-bg)}.card.ok .l,.card.ok .v{color:var(--app-ok)}
.card.warn{background:var(--app-warn-bg)}.card.warn .l,.card.warn .v{color:var(--app-warn)}
.cta{border:0;border-radius:14px;background:var(--app-accent);color:var(--app-accent-ink);font-size:calc(var(--s)*18px);font-weight:700;padding:15px 16px;width:100%;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:scale(.985)}
.cta:disabled{background:var(--app-line);color:var(--app-muted)}
.cta.pulse{animation:pulse 1.6s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,78,158,.0)}50%{box-shadow:0 0 0 8px rgba(29,78,158,.18)}}
.why{align-self:center;margin-top:8px;border:0;background:none;color:var(--app-accent);font-size:calc(var(--s)*13.5px);font-weight:700;padding:8px 10px;text-decoration:underline;text-underline-offset:3px}

/* lists, groups, page content */
.vpad{padding:8px 18px 28px;display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vtitle{font-size:calc(var(--s)*22px);font-weight:900}
.gtitle{font-size:calc(var(--s)*12px);font-weight:700;letter-spacing:.1em;color:var(--app-muted);margin:6px 4px -4px}
.group{background:var(--app-card);border:1px solid var(--app-line);border-radius:16px;overflow:hidden}
.group.pad{padding:14px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--app-line);background:none;text-align:left;min-height:58px}
.row:first-child{border-top:0}
.row:hover{background:var(--app-bg)}
.ri{width:36px;height:36px;border-radius:10px;background:var(--app-soft);color:var(--app-accent);display:grid;place-items:center;flex:none}
.ri svg{width:20px;height:20px}
.rt{flex:1;min-width:0;font-weight:700;font-size:calc(var(--s)*15px);line-height:1.4}
.rt small{display:block;font-weight:400;color:var(--app-muted);font-size:calc(var(--s)*12.5px);margin-top:1px}
.chev{color:var(--app-muted);width:18px;height:18px;flex:none}
.irow{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-top:1px solid var(--app-line)}
.irow:first-child{border-top:0}
.irow b{font-size:calc(var(--s)*14.5px)}
.irow span{font-size:calc(var(--s)*13.5px);color:var(--app-muted);line-height:1.6}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--app-line);cursor:pointer}
.trow:first-child{border-top:0}
.trow > span{display:flex;flex-direction:column;min-width:0}
.trow b{font-size:calc(var(--s)*15px)}
.trow small{font-size:calc(var(--s)*12.5px);color:var(--app-muted)}
input[role="switch"]{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;background:var(--app-line);position:relative;cursor:pointer;margin:0;transition:background .2s}
input[role="switch"]::before{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--app-card);box-shadow:0 1px 3px rgba(20,33,61,.3);transition:transform .2s}
input[role="switch"]:checked{background:var(--app-accent)}
input[role="switch"]:checked::before{transform:translateX(20px)}
.note{font-size:calc(var(--s)*12.5px);color:var(--app-muted);line-height:1.65;background:var(--app-soft);border-radius:10px;padding:10px 12px}
.ptext{font-size:calc(var(--s)*14.5px);line-height:1.7}
.btn2{border:1px solid var(--app-line);background:var(--app-card);color:var(--app-accent);font-weight:700;border-radius:14px;padding:12px 14px;width:100%;font-size:calc(var(--s)*15px);min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn2 svg{width:19px;height:19px}
.btn2:disabled{color:var(--app-muted);opacity:.6}
.btn-s{border:0;background:var(--app-accent);color:var(--app-accent-ink);font-weight:700;border-radius:12px;padding:0 16px;min-height:46px;white-space:nowrap;font-size:calc(var(--s)*15px)}
.empty{padding:14px;color:var(--app-muted);font-size:calc(var(--s)*14px)}
.chipst{font-size:calc(var(--s)*12px);font-weight:700;border-radius:999px;padding:3px 10px;background:var(--app-soft);color:var(--app-accent);white-space:nowrap}
.chipst.ok{background:var(--app-ok-bg);color:var(--app-ok)}
.chipst.warn{background:var(--app-warn-bg);color:var(--app-warn)}
.who{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--app-line);background:var(--app-card);border-radius:999px;padding:6px 10px 6px 14px;font-weight:700;font-size:calc(var(--s)*13px);color:var(--app-ink)}
.who svg{width:16px;height:16px;color:var(--app-muted)}
.appt{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--app-card);border:1px solid var(--app-line);border-radius:16px;padding:14px;text-align:left}
.appt .tm{font-size:calc(var(--s)*20px);font-weight:900;color:var(--app-accent);font-variant-numeric:tabular-nums;min-width:3.2em}
.appt .nm{font-weight:700;font-size:calc(var(--s)*15.5px);line-height:1.4}
.appt .pl{font-size:calc(var(--s)*13px);color:var(--app-muted)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0;font-size:calc(var(--s)*14.5px)}
.dl dt{color:var(--app-muted)}
.dl dd{margin:0;font-weight:700}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.items li{background:var(--app-bg);border:1px solid var(--app-line);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.items li b{font-size:calc(var(--s)*15px)}
.items li span{font-size:calc(var(--s)*13px);color:var(--app-muted);white-space:nowrap}
.opt{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--app-bg);border:1px solid var(--app-line);border-radius:12px;padding:12px 14px;text-align:left;min-height:54px}
.opt b{font-size:calc(var(--s)*15.5px)}
.opt span{font-size:calc(var(--s)*13px);color:var(--app-muted);white-space:nowrap}
.opt:hover{border-color:var(--app-accent)}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--app-bg);border:1px solid var(--app-line);border-radius:12px;padding:12px 14px;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--app-accent)}
.check span{display:flex;flex-direction:column;gap:2px}
.check b{font-size:calc(var(--s)*15px)}
.check small{font-size:calc(var(--s)*12.5px);color:var(--app-muted);line-height:1.55}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-top:1px solid var(--app-line);font-size:calc(var(--s)*15px)}
.mrow:first-child{border-top:0}
.mrow span{flex:1;min-width:0}
.xbtn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--app-muted);display:grid;place-items:center;flex:none}
.xbtn:hover{background:var(--app-bg)}
.xbtn svg{width:18px;height:18px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--app-line);border-radius:12px;padding:0 12px;min-height:46px;background:var(--app-card);font-size:calc(var(--s)*15px)}
.addrow input:focus{outline:2px solid var(--app-accent);outline-offset:0}
.orgbox{background:var(--app-card);border:1px solid var(--app-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.og h4{font-size:calc(var(--s)*13px);color:var(--app-accent);letter-spacing:.04em;margin-bottom:4px}
.og ul{margin:0;padding-left:1.2em;font-size:calc(var(--s)*15px);line-height:1.7}
.thinking{color:var(--app-muted);font-size:calc(var(--s)*14px);padding:6px 2px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--app-line);background:var(--app-bg);border-radius:999px;padding:5px 12px;font-size:calc(var(--s)*13px);font-weight:700;color:var(--app-accent)}
.termout{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--app-line);padding-top:12px}
.termout h4{font-size:calc(var(--s)*15px)}
.termout p{font-size:calc(var(--s)*14.5px);line-height:1.75}
.src{font-size:calc(var(--s)*12px);color:var(--app-muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;padding:7px 0;font-size:calc(var(--s)*14.5px);border-top:1px dashed var(--app-line)}
.tl li:first-child{border-top:0}
.tl b{font-variant-numeric:tabular-nums;color:var(--app-accent)}
.med{display:flex;flex-direction:column;gap:2px}
.med b{font-size:calc(var(--s)*16px)}
.med span{font-size:calc(var(--s)*13.5px);color:var(--app-muted)}
.medrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:13px 14px;border-top:1px solid var(--app-line)}
.bd:first-child{border-top:0}
.bd .bk{font-weight:700;font-size:calc(var(--s)*15px)}
.bd .bv{font-weight:900;font-size:calc(var(--s)*18px);font-variant-numeric:tabular-nums;color:var(--app-accent);text-align:right}
.bd .bs{grid-column:1/-1;font-size:calc(var(--s)*13px);color:var(--app-muted)}
.bd.me{background:var(--app-soft)}
.seg2{display:flex;background:var(--app-card);border:1px solid var(--app-line);border-radius:12px;padding:3px;gap:3px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:700;color:var(--app-muted);font-size:calc(var(--s)*14px)}
.seg2 button[aria-pressed="true"]{background:var(--app-accent);color:var(--app-accent-ink)}
.sz{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--app-card);border:1px solid var(--app-line);border-radius:14px;padding:14px}
.sz[aria-pressed="true"]{border:2px solid var(--app-accent);padding:13px}
.sz .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--app-line);flex:none;display:grid;place-items:center}
.sz[aria-pressed="true"] .r{border-color:var(--app-accent)}
.sz[aria-pressed="true"] .r::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--app-accent)}
.sz b{font-weight:700}
.bus{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 14px;border-top:1px solid var(--app-line);align-items:baseline}
.bus:first-child{border-top:0}
.bus b{font-size:calc(var(--s)*18px);font-weight:900;font-variant-numeric:tabular-nums}
.bus span{font-size:calc(var(--s)*13.5px);color:var(--app-muted)}
.mcard{border-radius:18px;background:var(--app-dark);color:var(--app-accent-ink);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.mcard .mt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mcard .mb{font-size:12px;font-weight:900;letter-spacing:.14em}
.mcard .mn{font-size:calc(var(--s)*20px);font-weight:900}
.mcard .mk{font-size:12px;opacity:.8}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--app-card);border-top:1px solid var(--app-line);padding:6px 10px 16px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0;color:var(--app-muted);font-size:calc(var(--s)*12px);font-weight:700;min-height:48px}
.tab .ti{width:54px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--app-accent)}
.tab[aria-current="page"] .ti{background:var(--app-soft)}

/* ---------- pushed pages ---------- */
.page{position:absolute;inset:0;z-index:3;background:var(--app-bg);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
.page.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.phead{flex:none;display:flex;align-items:center;gap:4px;padding:2px 12px 6px 8px;border-bottom:1px solid var(--app-line)}
.back{display:inline-flex;align-items:center;gap:0;border:0;background:none;color:var(--app-accent);font-weight:700;padding:10px 8px 10px 2px;font-size:calc(var(--s)*14px);flex:none}
.back svg{width:20px;height:20px}
.ptitle{font-size:calc(var(--s)*16.5px);font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 18px 28px;display:flex;flex-direction:column;gap:12px}

/* ---------- notification banner, toast ---------- */

/* ================= barcode (NW-7 / Codabar) & decorative QR ================= */
const CODABAR={'0':'0000011','1':'0000110','2':'0001001','3':'1100000','4':'0010010','5':'1000010','6':'0100001','7':'0100100','8':'0110000','9':'1001000','-':'0001100','$':'0011000',':':'1000101','/':'1010001','.':'1010100','+':'0010101','A':'0011010','B':'0101001','C':'0001011','D':'0001110'};
function barcodeSVG(data){ const s='A'+data+'A', N=2, W=5; let x=14, r='';
  for(const ch of s){ const pat=CODABAR[ch]; for(let k=0;k<7;k++){ const w=pat[k]==='1'?W:N; if(k%2===0) r+='<rect x="'+x+'" y="0" width="'+w+'" height="76"/>'; x+=w; } x+=N; }
  return '<svg viewBox="0 0 '+(x+12)+' 76" preserveAspectRatio="none" role="img" aria-label="診察券番号 '+data+' のバーコード">'+r+'</svg>'; }
function qrSVG(){ let seed=20261027; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const N=21; let r=''; const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ if(inF(x,y)) continue; if(rnd()<.47) r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; }
  [[0,0],[N-7,0],[0,N-7]].forEach(([x,y])=>{ r+='<rect x="'+x+'" y="'+y+'" width="7" height="7"/><rect class="l" x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>'; });
  return '<svg viewBox="0 0 21 21" shape-rendering="crispEdges">'+r+'</svg>'; }

function at(dt,type){ S.events.push({at:S.t+dt,type}); S.events.sort((a,b)=>a.at-b.at); save(); }
function cancel(type){ S.events=S.events.filter(e=>e.type!==type); }
function processEvents(){ let fired=false;
  while(S.events.length && S.events[0].at<=S.t+1e-9){ const e=S.events.shift(); const h=HANDLERS[e.type]; if(h) h(); fired=true; }
  if(fired){ save(); render(); } }
function predict(){ const q=S.visit.q; const avg=q.hist.reduce((a,b)=>a+b,0)/q.hist.length;
  const ev=S.events.find(e=>e.type==='q_next'); const cur=ev?Math.max(0,ev.at-S.t):avg;
  const callAt=S.t+cur+Math.max(0,q.ahead-1)*avg;
  const rb=Math.max(Math.ceil((S.t+0.01)/5)*5, Math.floor((callAt-10)/5)*5);
  return {avg,callAt,rb}; }
function startQueue(){ const q=S.visit.q;
  q.ahead=Math.max(4,Math.min(7,Math.round((11*60-S.t)/7))); q.idx=0; q.early=false; q.stop=false;
  cancel('q_next'); cancel('q_early'); at(2,'q_next'); at(7,'q_early'); q.rb=predict().rb; }
function checkStop(){ const v=S.visit,q=v.q; if(v.phase!=='wait_consult'||q.stop) return;
  const p=predict(); if(p.callAt-S.t<=20){ q.stop=true;
    if(v.loc!=='internal') notify('診察が近づいています',fmtT(p.rb)+'までに 2階 内科へお戻りください');
    save(); render(); } }

  notify('お呼びしています','診察番号 '+v.consultNo+' の方、2階 内科 3番診察室へお入りください');
  if(v.loc==='internal') at(2,'consult_start'); }
const HANDLERS={
  reception_ok(){ const v=S.visit; if(v.phase!=='reception') return; v.phase='to_blood'; v.times.reception=S.t;
    notify('保険証の確認が終わりました','次は 2階 採血室へお進みください'); },
  blood_call(){ const v=S.visit; if(v.phase!=='blood_wait') return; v.phase='blood_called'; v.times.bloodCall=S.t;

/* route guidance */
function startNav(from,to){ if(!PL[from]||!PL[to]) return; if(from===to){ toast('いまいる場所です'); return; }
  nav={from,to,steps:makeRoute(from,to),i:0}; renderNav(); }
function renderNav(){ if(!nav) return; const n=nav, st=n.steps[n.i], last=n.i===n.steps.length-1, D=PL[n.to];
  const html='<div class="navprog" aria-hidden="true">'+n.steps.map((_,k)=>'<span class="'+(k<=n.i?'on':'')+'"></span>').join('')+'</div>'+
    '<div class="mapwrap"><span class="flr">'+st.f+'階</span>'+floorSVG(st.f,st.p,st.f===D.f?n.to:null)+'</div>'+
    '<div class="navtx"><b>'+st.t+'</b><small>'+st.s+'</small></div>';
  const next=()=>{ if(!nav) return; nav.i++; renderNav(); };
  openSheet({title:D.f+'階 '+D.n+'まで',html,kind:'nav',
    actions:[last?{label:D.n+'に着いた',fn:arrive}:{label:'次へ',fn:next},
      {label:n.i?'前へ':'閉じる',cls:'sec',fn:()=>{ if(nav&&nav.i){ nav.i--; renderNav(); } else closeSheet(); }}],
    auto:last?arrive:next}); }
function arrive(){ if(!nav) return; const n=nav; nav=null; closeSheet(); const v=S.visit, to=n.to;
  S.t+=n.steps.length+1; v.loc=to;
  if(to==='reception'&&v.phase==='checkedin'){ v.phase='reception'; v.handed=false; }
  else if(to==='blood'&&v.phase==='to_blood'){ v.phase='blood_scan'; }
  else if(to==='internal'&&v.phase==='called'){ at(1,'consult_start'); }
  else if(to==='pay'&&v.phase==='after_consult'){ v.phase='pay'; }
  else if(to==='pharmacy'&&v.phase==='after_consult'){ v.phase='pharmacy'; }
  save(); processEvents(); render(); }

  if(!name){ el.classList.remove('show'); el.setAttribute('aria-hidden','true'); return; }
  const P=PAGES[name]; $('#ptitle').textContent=P.title;
  $('#pbackLabel').textContent=pageStack.length>1?PAGES[pageStack[pageStack.length-2]].title:TABNAME[tab];
  const body=$('#pbody'); body.innerHTML=''; P.render(body); body.scrollTop=0;

function boardRows(){ const v=S.visit,t=S.t,i=pidx(v.phase); const base=(k,a)=>Math.max(1,Math.round(k+a*Math.sin(t/9+k)));
  const rows=[];
  let ib, isub='', me=false;
  if(v.phase==='wait_consult'){ ib=(v.consultNo-v.q.ahead)+'番'; isub='いま診察中の番号 ／ あなたは '+v.consultNo+'番（前に'+v.q.ahead+'人）'; me=true; }
  else if(v.phase==='called'||v.phase==='in_consult'){ ib=v.consultNo+'番'; isub='あなたの番号です'; me=true; }
  else { ib=base(9,2)+'人'; isub='内科で待っている人'; }
  rows.push(['診察（内科）',ib,isub,me]);
  let bb, bs, bme=false;
  if(v.phase==='blood_wait'){ const ev=S.events.find(e=>e.type==='blood_call'); const n=ev?Math.max(1,Math.ceil((ev.at-t)/1.5)):1; bb=n+'人'; bs='あなた（'+v.blood.no+'）より前の人'; bme=true; }
  else if(v.phase==='blood_called'){ bb=v.blood.no; bs='あなたの番号を呼んでいます'; bme=true; }
  else { bb=base(12,4)+'人'; bs='採血を待っている人'; }
  rows.push(['採血',bb,bs,bme]);
  rows.push(['会計',base(7,3)+'人','計算・自動支払機を待っている人',false]);
  const ready=['A-118','A-119','A-121']; let ps='準備ができた番号（一部）'; let pme=false;
  if(i>=pidx('after_consult')&&i<pidx('done')){ ps=v.med.ready?'あなたの番号 '+v.med.no+' の準備ができました':'あなたの番号 '+v.med.no+' を準備しています'; pme=true; if(v.med.ready) ready.push(v.med.no); }
  rows.push(['お薬',ready.slice(-3).join(' '),ps,pme]);
  return rows; }

function pageSummary(el){ const v=S.visit, T=v.times;

let sampleFn=null, aiLive=false;
async function initAI(){ try{ if(window.claude&&typeof window.claude.use==='function'){ const s=await window.claude.use('sample'); if(s){ sampleFn=s; aiLive=true; renderPanel(); } } }catch(e){} }
const NO_SEND=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','invalid_request','cancelled'];
function aiModeNote(){ return aiLive
  ? '試作品では、AIの処理に外部の生成AI（Claude）を使っています。実際に病院で使うときは、病院が認めた環境で動かします。'
  : 'この表示ではAIにつながらないため、試作品では端末の中だけの簡易処理で代わりに動きます。外部には何も送りません。'; }
function logAI(what,text){ S.aiLog.unshift({t:S.t,what,text:String(text).slice(0,200)}); S.aiLog=S.aiLog.slice(0,30); save(); renderPanel(); }
function ensureAIConsent(){ if(S.settings.ai) return Promise.resolve(true);
  return new Promise(res=>{ let done=false; const fin=x=>{ if(done) return; done=true; res(x); };
    openSheet({title:'AIを使いますか？',kind:'consent',
      html:'<p class="sp">AIを使うのは、あなたが選んだこの操作のときだけです。使わなくても、ほかの案内はすべて動きます。</p>'+
        '<div class="group"><div class="irow"><b>AIに送るもの</b><span>いま入力した文章だけ</span></div><div class="irow"><b>送らないもの</b><span>お名前・診察券番号・病名・検査結果・カルテ・位置情報</span></div><div class="irow"><b>あとから</b><span>送った内容は記録に残り、いつでも消せます。メニューの「AIと情報の使い方」でオフにできます。</span></div></div>'+
        '<p class="note">'+aiModeNote()+'</p>',
      actions:[{label:'同意して使う',fn:()=>{ S.settings.ai=true; save(); fin(true); closeSheet(); renderPanel(); }},{label:'使わない',cls:'sec',fn:()=>{ fin(false); closeSheet(); }}],
      onClose:()=>fin(false)}); }); }
function localOrganize(items){ const tell=[],ask=[],seen=new Set();
  items.forEach(raw=>String(raw).split(/[。\n]/).forEach(s=>{ s=s.trim().replace(/[、。\s]+$/,''); if(!s||seen.has(s)) return; seen.add(s);
    const q=/[?？]$|か$|いつ|どう|何|なぜ|どれ|どのくらい|ですか|ますか|でしょうか/.test(s); const t=s.length>30?s.slice(0,29)+'…':s; (q?ask:tell).push(t); }));
  return {tell,ask}; }
async function organizeMemo(){ if(!S.memo.length) return; const ok=await ensureAIConsent(); if(!ok) return;
  const out=$('#memoOut'); if(!out) return; out.innerHTML='<div class="thinking">整理しています</div>';
  const text=S.memo.join('\n'); let res=null, mode='local';
  if(aiLive&&sampleFn){ try{
      const r=await sampleFn.json('あなたは病院の通院支援アプリの「聞きたいことの整理」機能です。患者さんが、診察の前に先生へ伝えたいこと・聞きたいことをメモしました。次のルールで整理してください。\n・診断、助言、推測はしない。メモにないことは足さない。\n・同じ内容はまとめる。\n・「先生に伝えたいこと」と「先生に聞きたいこと」に分ける。\n・1件30字以内の、先生にそのまま見せられる短い文にする。\n返答はJSONだけにしてください。形式：{"tell":["..."],"ask":["..."]}\n\nメモ：\n'+text,{modelTier:'quick'});
      const arr=a=>Array.isArray(a)?a.map(x=>String(x).trim()).filter(Boolean).slice(0,8):[];
      if(r&&(arr(r.tell).length||arr(r.ask).length)){ res={tell:arr(r.tell),ask:arr(r.ask)}; mode='live'; }
      logAI('聞きたいことの整理',text);
    }catch(e){ const c=e&&e.code; if(!NO_SEND.includes(c)) logAI('聞きたいことの整理',text); if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) aiLive=false; } }
  if(!res) res=localOrganize(S.memo);
  const o=$('#memoOut'); if(!o) return;
  const sec=(t,a)=>a.length?'<div class="og"><h4>'+t+'</h4><ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'';
  o.innerHTML='<div class="orgbox">'+sec('先生に伝えたいこと',res.tell)+sec('先生に聞きたいこと',res.ask)+
    '<p class="note">'+(mode==='live'?'AIが整理しました。内容を確かめてからお使いください。':'この表示ではAIにつながらないため、端末の中だけの簡易処理で整理しました。外部には送っていません。')+'</p>'+
    '<button class="btn2" type="button" id="orgApply">この内容でメモを置きかえる</button></div>';
  $('#orgApply').addEventListener('click',()=>{ S.memo=res.tell.concat(res.ask).slice(0,10); save(); lastVmKey=''; refreshPage(); toast('メモを置きかえました'); }); }

const GLOSSARY=[
 [['hba1c','ヘモグロビンa1c','ヘモグロビンエーワンシー'],'HbA1c（ヘモグロビン・エーワンシー）','過去1〜2か月の血糖（血液中の糖）の平均的な状態を表す、血液検査の値です。糖尿病かどうかを調べるときや、治療の効果を確かめるときに使われます。'],
 [['egfr','推算糸球体ろ過量'],'eGFR（推算糸球体ろ過量）','腎臓が血液をろ過して、いらないものを尿に出す力の目安です。血液検査のクレアチニンの値と、年齢・性別から計算します。値が低いほど、腎臓の働きが弱っていることを表します。'],
 [['ldl','ldlコレステロール','悪玉コレステロール'],'LDLコレステロール','血液中のコレステロールの一つで、「悪玉コレステロール」とも呼ばれます。増えすぎると血管の壁にたまり、動脈硬化の原因になります。'],
 [['hdl','hdlコレステロール','善玉コレステロール'],'HDLコレステロール','血管などにたまった余分なコレステロールを回収する働きがあり、「善玉コレステロール」とも呼ばれます。'],
 [['中性脂肪','トリグリセライド'],'中性脂肪','体のエネルギー源になる脂肪です。食べすぎや飲みすぎで増え、多すぎると動脈硬化などの原因になります。'],
 [['収縮期血圧','上の血圧','最高血圧'],'収縮期血圧（上の血圧）','心臓が縮んで、血液を全身に送り出すときの血圧です。'],
 [['拡張期血圧','下の血圧','最低血圧'],'拡張期血圧（下の血圧）','心臓が広がって、血液が心臓に戻ってくるときの血圧です。'],
 [['経過観察'],'経過観察','すぐに治療を始めたり変えたりせず、決めた間隔で診察や検査をして、様子を見ることです。'],

const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');
function lookup(term){ const n=norm(term); if(!n) return null; return GLOSSARY.find(g=>g[0].some(k=>norm(k)===n))||null; }
function termActions(term){ return '<button class="btn2" type="button" id="termMemo">次回の「聞きたいこと」に入れる</button>'; }
function bindTermMemo(term){ const b=$('#termMemo'); if(b) b.addEventListener('click',()=>{ S.memo.push('「'+term+'」について聞きたい'); save(); toast('次回の「聞きたいこと」に入れました'); b.disabled=true; }); }
async function explainTerm(raw){ const term=String(raw||'').trim().slice(0,40); const out=$('#termOut'); if(!term||!out) return; out.hidden=false;
  const g=lookup(term);
  if(g){ out.innerHTML='<h4>'+esc(g[1])+'</h4><p>'+esc(g[2])+'</p><p class="src">アプリの用語辞書から表示しました（AIは使っていません）。詳しくは主治医や薬剤師にご確認ください。</p>'+termActions(term); bindTermMemo(term); return; }
  out.innerHTML='<p>「'+esc(term)+'」は、アプリの用語辞書にありませんでした。</p><button class="btn2" type="button" id="termAI">'+I.spark+'AIに聞く（使うときだけ）</button>'+termActions(term);
  bindTermMemo(term);
  $('#termAI').addEventListener('click',async()=>{ const ok=await ensureAIConsent(); if(!ok) return; const o=$('#termOut'); if(!o) return;
    if(!(aiLive&&sampleFn)){ o.innerHTML='<p>この表示ではAIにつながらないため、試作品では説明を出せません。次回の「聞きたいこと」に入れておくと、診察で先生に確認できます。</p>'+termActions(term); bindTermMemo(term); return; }
    o.innerHTML='<h4>'+esc(term)+'</h4><p id="termAns" class="thinking">考えています</p>';
    try{ const r=await sampleFn('あなたは病院の通院支援アプリの「ことばの説明」機能です。患者さんが、診察やお薬の説明で分からなかった言葉を入力しました。次のルールで答えてください。\n・その言葉の一般的な意味だけを、やさしい日本語で3文以内で説明する。\n・診断、治療の判断、お薬の飲み方の指示はしない。この患者さんの体の状態には触れない。\n・医療や健康と関係のない言葉、または意味が分からない言葉なら「この言葉は説明できません。」とだけ答える。\n・最後に「詳しくは主治医や薬剤師にご確認ください。」と書く。\n・見出し、箇条書き、記号での強調は使わない。\n\n言葉：'+term,
        {modelTier:'quick',onText:({text})=>{ const a=$('#termAns'); if(a){ a.classList.remove('thinking'); a.textContent=text; } }});
      logAI('ことばの説明',term);
      const a=$('#termAns'); if(a){ a.classList.remove('thinking'); a.textContent=r.text; }
      const o2=$('#termOut'); if(o2){ o2.insertAdjacentHTML('beforeend','<p class="src">AIが一般的な意味を説明しました。あなたの体の状態についての説明ではありません。</p>'+termActions(term)); bindTermMemo(term); }
    }catch(e){ const c=e&&e.code; if(!NO_SEND.includes(c)) logAI('ことばの説明',term);
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) aiLive=false;
      const a=$('#termAns'); if(a){ a.classList.remove('thinking'); a.textContent=c==='rate_limited'?'いま混み合っています。少し時間をおいてお試しください。':c==='refused'?'この言葉は説明できません。':'AIにつながりませんでした。次回の「聞きたいこと」に入れておくと、診察で確認できます。'; } } }); }

  if(b('onbAgree')) b('onbAgree').addEventListener('change',e=>{ b('onbNext').disabled=!e.target.checked; });
  if(onbStep===2&&b('onbNext')) b('onbNext').addEventListener('click',()=>{ onbStep=3; renderOnb(); });
  if(onbStep===3&&b('onbNext')) b('onbNext').addEventListener('click',()=>{ S.settings.sound=b('onbSound').checked; S.settings.vibrate=b('onbVib').checked; S.regEnd=Date.now(); onbStep=4; renderOnb(); });
  if(b('onbDone')) b('onbDone').addEventListener('click',finishOnb);
  if(onbStep>0){ const f=o.querySelector('.cta:not([disabled])'); if(f) setTimeout(()=>f.focus({preventScroll:true}),60); } }
function finishOnb(){ S.registered=true; S.t=START; S.events=[]; S.visit=freshVisit();
  S.notes=[{id:'reg',t:START,title:'登録が完了しました',body:'KINDAI PASS をご利用いただけます',read:false}];
  save(); $('#onb').hidden=true; setTab('today'); render(); const c=$('#cta'); if(c){ c.classList.add('pulse'); c.focus({preventScroll:true}); } }

/* ================= prototype guide (panel on a computer, sheet on a phone) ================= */
const STEPS=['どこでも受付','総合受付','採血','待ち時間','診察','会計・お薬','帰宅後'];
function guideBlocks(){ const p=phaseInfo(), v=S.visit; const showEarly=S.registered&&v.phase==='wait_consult'&&!v.q.early;
  return '<section class="box"><h2 class="bh">いまの画面</h2><div class="ph">'+esc(p.label)+'</div><p class="how">'+esc(p.how)+'</p><div class="chips">'+p.data.map(d=>'<span class="chip">使う情報：'+esc(d)+'</span>').join('')+'</div></section>'+
   '<section class="box"><h2 class="bh">試作品の操作</h2>'+
     '<div class="ctrl"><span class="lbl">待ち時間の進み方</span><div class="seg" role="group" aria-label="待ち時間の進み方">'+[1,20,60].map(x=>'<button type="button" data-g="speed" data-v="'+x+'" aria-pressed="'+(S.speed===x)+'">'+(x===1?'実際の速さ':x+'倍')+'</button>').join('')+'</div></div>'+
     '<div class="gbtns"><button class="gbtn primary" type="button" data-g="skip">次の出来事まで進める</button>'+(showEarly?'<button class="gbtn event" type="button" data-g="early">順番が早まる出来事を起こす</button>':'')+
     '<button class="gbtn" type="button" data-g="auto" aria-pressed="'+S.auto+'">'+(S.auto?'おまかせを止める':'おまかせで進める')+'</button></div>'+
     '<div class="gbtns small"><button class="gbtn" type="button" data-g="resetVisit">通院の最初に戻る</button><button class="gbtn" type="button" data-g="resetAll">登録からやり直す</button></div>'+
     '<p class="fine2">院内の時刻 <b class="simclock">'+fmtT(S.t)+'</b>。病院からの知らせを待つあいだだけ、時刻を速く進めています。</p></section>'+
   '<section class="box"><h2 class="bh">個人の情報とAIの扱い</h2><ul class="plist">'+
     '<li><b>戻る時刻の予測</b><span>内科全体の待ち人数と平均の診察時間だけで計算します。個人の情報は使いません。</span></li>'+
     '<li><b>位置情報</b><span>使いません。院内の案内は、選んだ行き先から表示します。</span></li>'+
     '<li><b>生成AI</b><span>初めはオフです。本人が使うと決めたときだけ、入力した文章だけを送ります。送った内容は記録に残り、消せます。</span></li></ul>'+
     '<div class="aistat">AIの機能：<b>'+(S.settings.ai?'オン':'オフ')+'</b> ・ AIに送った情報：<b>'+(S.aiLog.length?S.aiLog.length+'件（本人が送ったもの）':'なし')+'</b></div></section>'+
   '<section class="box"><h2 class="bh">通院の流れ</h2><ol class="flow">'+STEPS.map((s,k)=>'<li class="'+(k<p.step?'done ':'')+(k===p.step?'now':'')+'"><span class="no">'+(k+1)+'</span><span>'+s+'</span></li>').join('')+'</ol></section>'; }
function renderPanel(){ const g=$('#guide'); if(g) g.innerHTML=guideBlocks();
  if(sheetState&&sheetState.kind==='guide'){ const b=$('#sheetBody'); if(b) b.innerHTML='<div class="guide gsheet">'+guideBlocks()+'</div>'; } }
function openGuideSheet(){ openSheet({title:'試作品メニュー',kind:'guide',html:'<div class="guide gsheet">'+guideBlocks()+'</div><p class="note">近畿大学病院「通院支援アプリ アイデアコンテスト2026」の提案 KINDAI PASS の試作品です。予約・番号・時刻・院内の配置・お薬などは、すべて架空の例です。</p>',actions:[{label:'閉じる',cls:'sec',fn:closeSheet}]}); }
$('#protoBtn').addEventListener('click',openGuideSheet);
document.addEventListener('click',e=>{ const b=e.target.closest('[data-g]'); if(!b) return; const g=b.dataset.g;
  if(g==='speed'){ S.speed=+b.dataset.v; save(); renderPanel(); }
  else if(g==='skip') skipToNext();
  else if(g==='early'){ cancel('q_early'); HANDLERS.q_early(); save(); render(); }
  else if(g==='auto'){ if(!S.registered){ toast('先に利用登録をしてください'); return; } S.auto=!S.auto; autoLast=0; save(); renderPanel(); if(S.auto){ closeSheet(); toast('画面の操作を自動で進めます'); } }
  else if(g==='resetVisit') resetVisit();
  else if(g==='resetAll') resetAll(); });
function skipToNext(){ if(!S.registered){ toast('先に利用登録をしてください'); return; }
  if(!S.events.length){ toast('いまは、画面の青いボタンで進みます'); return; }
  S.t=Math.max(S.t,S.events[0].at); processEvents(); render(); }
function resetVisit(){ closeSheet(); S.t=START; S.visit=freshVisit(); S.events=[]; S.auto=false;
  S.notes=S.notes.filter(n=>n.id==='reg'); save(); setTab('today'); render(); toast('通院の最初に戻りました'); }
function resetAll(){ closeSheet(); const keep={size:S.settings.size}; S=freshState(); S.settings.size=keep.size; save(); onbStep=0; scanned=false; pageStack=[]; showPage(); setTab('today'); renderOnb(); render(); }

/* ================= render & clock ================= */
function applySize(){ $('#screen').dataset.size=S.settings.size; }
function render(){ applySize(); if(tab==='today') renderToday(false); else if(tab==='appts') renderAppts(); else renderMenu();
  renderPanel(); updateBadge(); const top=pageStack[pageStack.length-1]; if(top&&PAGES[top].live) refreshPage(); }
let lastReal=performance.now(), lastMin=-1, autoLast=0;
function maybeAuto(){ if(!S.auto||!S.registered) return; const now=performance.now(); if(now-autoLast<2400) return; autoLast=now;
  if(!$('#big').hidden){ $('#big').hidden=true; return; }
  if(sheetOpen()){ if(sheetState&&sheetState.auto) sheetState.auto(); else closeSheet(); return; }
  if(pageStack.length){ pageStack=[]; showPage(); renderTab(); return; }
  if(tab!=='today'){ setTab('today'); return; }
  if(S.visit.phase==='done'){ S.auto=false; save(); renderPanel(); toast('最後まで進みました'); return; }
  const m=vm(); if(m.auto&&m.cta.act&&!m.cta.disabled) runAct(m.cta.act); }
setInterval(()=>{ const now=performance.now(); const dt=Math.min(5,(now-lastReal)/1000); lastReal=now;
  if(document.hidden||!S.registered) return;
  const rate=S.events.length?S.speed:1; S.t=Math.min(23*60,S.t+dt*rate/60);
  processEvents(); checkStop();
  const m=Math.floor(S.t+1e-6); if(m!==lastMin){ lastMin=m; $$('.simclock').forEach(e=>e.textContent=fmtT(S.t)); if(tab==='today') renderToday(false);
    const top=pageStack[pageStack.length-1]; if(top&&PAGES[top].live) refreshPage();
    if(m%5===0) save(); }
  maybeAuto(); },250);
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(!$('#big').hidden){ $('#big').hidden=true; return; } if(sheetOpen()){ closeSheet(); return; } if(pageStack.length) closePage(); });

/* start */
$$('.simclock').forEach(e=>e.textContent=fmtT(S.t));
setTab('today'); renderOnb(); render(); initAI();
})();
</script>
